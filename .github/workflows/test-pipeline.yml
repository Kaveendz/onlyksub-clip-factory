name: Test Clip Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Pixeldrain (or direct) video URL"
        required: true
        type: string
      srt_url:
        description: "Raw URL to the .srt/.ass subtitle file (e.g. Gist raw_url)"
        required: true
        type: string
      drama_name:
        description: "Drama name (for Gemini prompt context)"
        required: true
        type: string

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install --quiet google-genai opencv-python-headless mediapipe numpy

      - name: Step 1a - Download video
        run: python scripts/download_video.py "${{ inputs.video_url }}" work/input_video.mp4

      - name: Step 1b - Download subtitle
        run: python scripts/download_subtitle.py "${{ inputs.srt_url }}" work/subs.srt

      - name: Step 1c - Parse subtitle
        run: python scripts/parse_subtitle.py work/subs.srt work/dialogue.json

      - name: Step 2a - Detect scene changes
        run: python scripts/detect_scenes.py work/input_video.mp4 work/scenes.json

      - name: Step 2b - Detect audio spikes
        run: python scripts/detect_audio_spikes.py work/input_video.mp4 work/audio_spikes.json

      - name: Step 2c - Gemini moment detection
        run: |
          python scripts/gemini_moment_detect.py \
            work/dialogue.json work/scenes.json work/audio_spikes.json \
            work/moments.json "${{ inputs.drama_name }}"

      - name: Step 3a - Cut clips
        run: python scripts/cut_clips.py work/input_video.mp4 work/moments.json work/clips_raw

      - name: Step 3b - Reframe to 9:16 (face-tracking + fallback)
        run: |
          mkdir -p work/clips_vertical
          i=1
          for f in work/clips_raw/clip_*.mp4; do
            python scripts/reframe_crop.py "$f" "work/clips_vertical/clip_${i}.mp4"
            i=$((i+1))
          done

      - name: Step 3c - Build per-clip subtitles + burn
        run: |
          mkdir -p work/clips_final
          python3 - << 'PYEOF'
          import json, subprocess

          moments = json.load(open("work/moments.json"))
          for i, m in enumerate(moments, start=1):
              ass_path = f"work/clip_{i}.ass"
              subprocess.run([
                  "python", "scripts/make_clip_ass.py",
                  "work/dialogue.json", m["start"], m["end"],
                  ass_path, "Noto Sans Sinhala", "56",
              ], check=True)
              subprocess.run([
                  "python", "scripts/burn_clip_subs.py",
                  f"work/clips_vertical/clip_{i}.mp4", ass_path,
                  f"work/clips_final/clip_{i}.mp4", "fonts",
              ], check=True)
          PYEOF

      - name: Step 3d - Generate captions per clip
        run: |
          python3 - << 'PYEOF'
          import json, subprocess

          moments = json.load(open("work/moments.json"))
          for i, m in enumerate(moments, start=1):
              subprocess.run([
                  "python", "scripts/generate_captions.py",
                  "${{ inputs.drama_name }}", m.get("reason", m.get("text", "")),
                  m.get("emotion_type", "suspense"),
                  f"work/clip_{i}_captions.json",
              ], check=True)
          PYEOF

      - name: Show results
        run: |
          echo "=== Parsed dialogue count ==="
          python3 -c "import json; print(len(json.load(open('work/dialogue.json'))))"
          echo "=== Scene changes found ==="
          python3 -c "import json; print(len(json.load(open('work/scenes.json'))['scene_change_timestamps']))"
          echo "=== Audio spikes found ==="
          python3 -c "import json; print(len(json.load(open('work/audio_spikes.json'))['audio_spike_timestamps']))"
          echo "=== Selected clip moments ==="
          cat work/moments.json
          echo "=== Final clips ==="
          ls -lh work/clips_final/
          echo "=== Sample captions (clip 1) ==="
          cat work/clip_1_captions.json || true

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-results
          path: work/
          retention-days: 3
